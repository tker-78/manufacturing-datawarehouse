models:
  - name: agg_hourly_coil_production
    description: |
      hourly coil production aggregate.
      grain: calendar hour
      hourの途中でshiftが切り替わる場合があるため、
      shiftはbase shift(そのtime bucket内で最初のshift)とする。
    columns:
      - name: hour
        data_tests:
          - not_null
      - name: coil_weight
      - name: coil_length
      - name: coil_production_process_time
  - name: agg_coil_production_by_shift
    description: |
      coil production aggregate by shift.
      grain: shift x shift_crew
    columns:
      - name: shift
        data_tests:
          - not_null
      - name: shift_crew
        data_tests:
          - not_null
      - name: coil_weight
        data_tests:
          - not_null
          - non_negative
      - name: coil_length
        data_tests:
          - not_null
          - non_negative
      - name: coil_production_process_time
        data_tests:
          - not_null
          - non_negative
  - name: agg_coil_rejection_by_shift
    description: |
      coil rejection aggregate by shift.
      grain: shift x shift_crew
    columns:
      - name: shift
        data_tests:
          - not_null
      - name: shift_crew
        data_tests:
          - not_null
      - name: coil_weight
        data_tests:
          - non_negative
      - name: coil_count
        data_tests:
          - non_negative


