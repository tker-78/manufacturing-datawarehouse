version: 2

models:
  - name: int_coil_shift_attribution
    description: | 
      This model is used to track coil shift attribution.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - shift_id
              - coil_id
    columns:
      - name: shift_id
        data_tests:
          - not_null
      - name: coil_id
        data_tests:
          - not_null
          - unique
  - name: int_coil_length
    description: |
      Length calculation from its weight and thickness
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              abs(
                weight - thickness * width * length * 2.7 * 10^(-3)
              ) < 0.01
    columns:
      - name: coil_id
        data_tests:
          - not_null
          - unique
      - name: thickness
        description: "unit: mm"
        data_tests:
          - not_null
          - non_negative
      - name: width
        description: "unit: mm"
      - name: weight
        description: "unit: kg"
      - name: length
        description: "unit: m" 
      
