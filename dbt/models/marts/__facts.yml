version: 2

models:
  - name: fact_coil_completion
    description: |
      Fact table for coil completion.
      1 row per coil completion.
    columns:
      - name: coil_id
        data_tests:
          - not_null
          - unique
      - name: shift_key
      - name: coil_completion_timestamp
        data_tests:
          - not_null
      - name: coil_weight
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: coil_length
      - name: coil_width
      - name: coil_thickness
      - name: coil_quality_rating
      - name: coil_completion_duration
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
  - name: fact_coil_rejection
    description: |
      Fact table for coil rejection.
      1 row per coil rejection.
    columns:
      - name: coil_id
        data_tests:
          - not_null
          - unique
      - name: shift_key
        data_tests:
          - not_null
      - name: coil_completion_timestamp
      - name: coil_weight
      - name: coil_length
      - name: coil_width
      - name: coil_thickness
      - name: coil_quality_rating
      - name: coil_completion_duration
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false





