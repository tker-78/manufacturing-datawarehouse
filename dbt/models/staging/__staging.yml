version: 2

models:
  - name: stg_conversion
    description: "コイル単位の検査結果、測定データ。 1レコード = 1コイル"
    columns:
      - name: piecename
      - name: timestamp_local
      - name: timestamp_utc
      - name: coil_id
      - name: pallet_no
      - name: dc_no
      - name: fm_del_thickness_target
      - name: fm_del_width_target
      - name: fm_del_thickness_average
      - name: fm_del_width_average
      - name: coil_diameter_inner
      - name: coil_diameter_outer
      - name: weight_operation_flag
      - name: weight_measured_timestamp
      - name: coil_weight_calculated
      - name: coil_weight_actual
      - name: routing_code
      - name: coil_shape
      - name: coil_shape_reason
      - name: strip_surface
      - name: strip_surface_reason
      - name: eject_timestamp_utc
      - name: is_rejected
      - name: reject_area
      - name: reject_reason_code
      - name: reject_reason
      - name: reject_timestamp_utc
      - name: is_inspected
      - name: is_hold_move
      - name: is_inspect_requested
      - name: strap_number
  - name: stg_pdi
    description: ""
    columns:
      - name: piecename
      - name: timestamp_local
      - name: timestamp_utc
      - name: slab_id
      - name: coil_id
      - name: is_error_data
      - name: expire_timestamp_utc
      - name: ghost_coil_mode
      - name: mdllrn_skip
      - name: grade_name
      - name: slab_thickness_cold
      - name: slab_length_cold
      - name: slab_width_cold
      - name: slab_weight
      - name: slab_id_ctr
      - name: rm_del_thickness_target
      - name: rm_del_temperature_target
      - name: rm_del_temperature_target_tolerance_positive
      - name: rm_del_temperature_target_tolerance_negative
      - name: rm_del_thickness_cold
      - name: rm_del_width_cold
      - name: fm_ent_temperature_target
      - name: rsucalcxfrthick
      - name: is_recharged_flag
      - name: fm_del_thickness_target
      - name: fm_del_thickness_target_original
      - name: fm_del_thickness_nominal
      - name: fm_del_width_target
      - name: fm_del_width_target_original
      - name: fm_del_width_nominal
      - name: product_type
      - name: number_of_devide_cuts
      - name: is_divided
      - name: routing_code
      - name: slab_thickness_cold_original
      - name: slab_length_cold_original
      - name: slab_width_cold_original
      - name: slab_weight_original
      - name: sequence_no
      - name: planned_coil_id
      - name: planned_slab_id
  - name: stg_tracking
    description: |
      このモデルは、r_trkactの情報から、
      各カラム名をrenameして、後続のモデルから扱いやすい形式にしたものです。
    columns:
      - name: coil_id
        data_test: 
          - not_null
          - unique
      - name: fce_extract_timestamp_utc
        data_tests:
          - not_null
          - non_negative
      - name: dc_z_off_timestamp_utc
        data_tests:
          - not_null
          - non_negative
  - name: stg_shift
    description: ""
    columns:
      - name: shift_id
      - name: shift_start_timestamp_utc
      - name: shift_end_timestamp_utc
      - name: shift_no
      - name: group_name
      - name: shift_start_timestamp_local
      - name: shift_end_timestamp_local


